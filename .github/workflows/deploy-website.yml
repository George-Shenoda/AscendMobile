name: Build and deploy website

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into native projects
        run: npx cap sync

      - name: Verify app shell
        run: |
          set -euo pipefail
          test -f www/index.html
          test -f www/manifest.webmanifest
          test -f www/vendor/tailwind.js
          test -f www/vendor/lucide.js
          grep -q 'viewport-fit=cover' www/index.html
          grep -q 'vendor/tailwind.js' www/index.html
          ! grep -q 'cdn.tailwindcss.com' www/index.html

      - name: Build site
        run: |
          set -euo pipefail
          rm -rf _site
          cp -r www _site
          printf 'built %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4